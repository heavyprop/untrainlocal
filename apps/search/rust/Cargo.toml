[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
cxx = "1.0.202"
sea-query = { version = "1.0.2", default-features = false, features = ["backend-postgres", "with-json"] }
sea-query-sqlx = { version = "0.9.1", default-features = false, features = ["sqlx-postgres", "with-json"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "derive", "chrono", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
subtle = "2.6.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
cxx-build = "1.0.202"
pkg-config = "0.3.34"
