name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      SEARCH_SERVICE_TOKEN: ci-test-token-not-used-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/web.txt ruff==0.16.7
      - run: python manage.py check --settings=config.settings.development
      - run: python -m unittest apps.search.test_client
      - run: python -m ruff check apps common config safe_cli scripts manage.py
      - run: python -m ruff format --check apps common config safe_cli scripts manage.py
  search:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/search/rust
    steps:
      - uses: actions/checkout@v4
      - name: Test Rust and C++ in the Docker build environment
        run: docker build --target test -t search-tests .
